name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  nix:
    name: Nix
    runs-on: nix
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: nix fmt -- --ci

  rust:
    name: Rust
    runs-on: nix
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install web dependencies
        run: nix develop -c npm ci --prefix web

      - name: Check formatting
        run: nix develop -c cargo fmt --all --check

      - name: Run clippy
        run: nix develop -c cargo clippy --workspace --all-targets --locked -- -D warnings

  web:
    name: Web
    runs-on: nix
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: nix develop -c npm ci --prefix web

      - name: Check formatting
        run: nix develop -c npm run lint --prefix web

      - name: Check Svelte and TypeScript
        run: nix develop -c npm run check --prefix web
